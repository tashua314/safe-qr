<div class="intro"><h1>SafeQR：ストア画像の構成案</h1><p>最初に「開く前に確認」、続いて履歴と任意の外部チェックを紹介します。アプリ画面は実装からの原本、背景のみ画像モデルで生成。模擬データを使用した掲載前の候補です。iPhone・iPad各3枚。アップロード・審査提出はしていません。</p></div><main class="gallery"></main>
<script>
const slides=[
 {id:'01-check-before-open',title:'そのQR、<br><em>開く前に確認。</em>',sub:'注意・危険な可能性を、リンクを開く前に。',foot:'表示を見て、開くかどうかを選べます。',note:'判定は安全性を保証しません。画面は模擬データです。',iphone:'../pr-captures/issue-8/iphone-caution-warning.png',ipad:'ipad-caution-history-camera-denied.jpg'},

 {id:'03-optional-check',title:'外部チェックは、<br><em>あなたが選ぶ。</em>',sub:'初期設定はOFF。厳しさも3段階から。',foot:'使い方に合わせて、設定できます。',note:'ON時はGoogleへハッシュの一部等が送信されます。',iphone:'../pr-captures/issue-8/iphone-settings.png',ipad:'../app-store-candidates/ipad-settings-camera-denied.jpg'}
];
const params=new URLSearchParams(location.search),only=params.get('device'),slide=params.get('slide');
if(only)document.body.classList.add('export');
for(const device of only?[only]:['iphone','ipad']){for(const [i,s] of slides.entries()){if(slide&&Number(slide)!==i+1)continue;const tile=document.createElement('section');tile.className='tile';const w=device==='ipad'?2064:1206,h=device==='ipad'?2752:2622;tile.style.width='360px';tile.style.height=(h*360/w)+'px';const p=document.createElement('article');p.className='poster '+device;p.id=device+'-'+s.id;p.style.transform='scale('+(360/w)+')';p.style.transformOrigin='top left';p.innerHTML='<div class="brand"><img class="mark" src="app-icon.png" alt="">SafeQR<span class="tag">QR LINK CHECK</span></div><div class="copy"><h2>'+s.title+'</h2><p>'+s.sub+'</p></div><div class="device"><img alt="SafeQRの実装画面" src="'+s[device]+'"></div><div class="footer"><strong>'+s.foot+'</strong>'+s.note+(device==='ipad'?'<br>iPad実画面の一部を拡大。':'')+'</div>';tile.append(p);document.querySelector('main').append(tile);}}
