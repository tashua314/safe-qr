name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Portable checks and change detection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ios_required: ${{ steps.changes.outputs.ios_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Portable checks
        run: scripts/check-portable.sh
      - name: Detect iOS changes
        id: changes
        env:
          SAFEQR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SAFEQR_FORCE_IOS: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/ci-changes.py

  ios:
    name: iOS lint, build, and tests
    needs: changes
    if: needs.changes.outputs.ios_required == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install lint tools
        run: scripts/install-check-tools.sh
      - name: Run quality checks
        run: scripts/check.sh
      - name: Save validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-validation
          path: |
            .artifacts/*.log
            .artifacts/*.xcresult
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  check:
    name: Quality gate
    needs: [changes, ios]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify required results
        env:
          SAFEQR_PORTABLE_RESULT: ${{ needs.changes.result }}
          SAFEQR_IOS_REQUIRED: ${{ needs.changes.outputs.ios_required }}
          SAFEQR_IOS_RESULT: ${{ needs.ios.result }}
        run: python3 scripts/ci-gate.py
